plugins {
    id 'com.android.application'
}

android {
    namespace 'com.warrenstack.nightaudio'
    compileSdk 36

    defaultConfig {
        applicationId 'com.warrenstack.nightaudio'
        minSdk 29
        targetSdk 36
        versionCode 9
        versionName '0.5.4'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    // The engine AARs do not use their transitive AndroidX UI dependencies.
    implementation('io.github.junkfood02.youtubedl-android:library:0.18.1') {
        exclude group: 'androidx.appcompat'
        exclude group: 'androidx.core', module: 'core-ktx'
    }
    implementation('io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1') {
        exclude group: 'androidx.appcompat'
        exclude group: 'androidx.core', module: 'core-ktx'
    }
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
